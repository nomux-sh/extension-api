# Code generation for the Rust crate `nomux-extension`, the TypeScript
# package `@nomux-sh/extension` and the Go module
# `github.com/nomux-sh/extension-api/sdk/go`.
#
# The three plugins run locally. No plugin is downloaded and no remote plugin
# runs:
#
# - protoc-gen-nomux-prost is a binary in this workspace
#   (tools/protoc-gen-nomux-prost). Cargo.lock pins its `prost-build` version
#   together with the `prost` runtime version of `nomux-extension`.
# - protoc-gen-ts_proto comes from the npm package `ts-proto`.
#   package-lock.json pins its version. Run `npm ci` before `buf generate`.
#   The generated code imports only `@bufbuild/protobuf/wire`, thus an
#   extension does not load a reflection runtime at its start.
# - protoc-gen-go comes from the module `google.golang.org/protobuf`.
#   `go run -C sdk/go` builds it with the version in sdk/go/go.mod, which is
#   also the version of the runtime of the Go SDK. The generated package is
#   internal: the public API of the Go SDK has its own types.
#
# Run `buf generate` from the repository root.
version: v2
clean: true
inputs:
  - directory: proto
plugins:
  - local:
      - cargo
      - run
      - --quiet
      - --locked
      - --package
      - protoc-gen-nomux-prost
    out: crates/nomux-extension/src/generated
  - local: node_modules/.bin/protoc-gen-ts_proto
    out: sdk/typescript/src/generated
    opt:
      - env=browser
      - esModuleInterop=true
      - forceLong=bigint
      - importSuffix=.js
      - oneof=unions-value
      - outputJsonMethods=false
      - outputPartialMethods=false
      - outputServices=none
      - outputTypeRegistry=false
      - exportCommonSymbols=false
      - removeEnumPrefix=true
      - useDate=false
  - local:
      - go
      - run
      - -C
      - sdk/go
      - google.golang.org/protobuf/cmd/protoc-gen-go
    out: sdk/go/internal/wire
    opt:
      - module=github.com/nomux-sh/extension-api/sdk/go/internal/wire
      - Mnomux/extension/v1/call.proto=github.com/nomux-sh/extension-api/sdk/go/internal/wire;wire
      - Mnomux/extension/v1/envelope.proto=github.com/nomux-sh/extension-api/sdk/go/internal/wire;wire
      - Mnomux/extension/v1/handshake.proto=github.com/nomux-sh/extension-api/sdk/go/internal/wire;wire
      - Mnomux/extension/v1/lifecycle.proto=github.com/nomux-sh/extension-api/sdk/go/internal/wire;wire
