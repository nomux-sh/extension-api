name: CI

# The shared jobs call the reusable workflows of the organization. The steps
# are in https://github.com/nomux-sh/.github/tree/main/.github/workflows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The oldest Node.js LTS line that has support. `engines` in
  # sdk/typescript/package.json has the same minimum.
  NODE_VERSION: "22"
  # The oldest Go release that has support. `go` in sdk/go/go.mod has the
  # same minimum.
  GO_VERSION: "1.26"

jobs:
  # Finds the newest version tag for the breaking change check. The output is
  # empty until the first tag exists, and then the check does not run. The
  # pattern starts with refs/tags/: without it, `git ls-remote` also matches
  # the tags sdk/go/vX.Y.Z of the Go module.
  last-tag:
    name: last tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      breaking-against: ${{ steps.find.outputs.breaking-against }}
    steps:
      - name: Find the newest version tag
        id: find
        run: |
          set -euo pipefail
          tag="$(git -c versionsort.suffix=- ls-remote --tags --refs --sort=-version:refname \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" 'refs/tags/v[0-9]*.[0-9]*.[0-9]*' |
            awk -F/ 'NR == 1 { print $3 }')"
          if [ -n "$tag" ]; then
            echo "breaking-against=.git#tag=$tag" >> "$GITHUB_OUTPUT"
          fi
          echo "Newest version tag: ${tag:-none}"

  buf:
    needs: last-tag
    uses: nomux-sh/.github/.github/workflows/buf-ci.yml@main
    with:
      working-directory: .
      breaking-against: ${{ needs.last-tag.outputs.breaking-against }}

  rust:
    uses: nomux-sh/.github/.github/workflows/rust-ci.yml@main
    with:
      # Linux only. The crate has no platform-specific code.
      os: '["ubuntu-latest"]'
      working-directory: .
      run-deny: true
      run-machete: true

  repo-lint:
    uses: nomux-sh/.github/.github/workflows/repo-lint.yml@main
    with:
      license: code
      require-changelog: true

  generated:
    name: generated code is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUF_VERSION: 1.75.0
      BUF_SHA256: fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install buf
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/buf" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          echo "${BUF_SHA256}  $RUNNER_TEMP/bin/buf" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/bin/buf"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The TypeScript plugin of `buf generate` is in the npm dependencies.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: npm ci
        run: npm ci
      # The Go plugin of `buf generate` is in the module of the Go SDK.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sdk/go/go.sum
      - name: buf build
        run: buf build
      - name: Check generated code
        run: scripts/check-generated.sh
      - name: Check the extension API version of the SDKs
        run: scripts/check-api-version.sh

  # Examines the Go SDK and its example: format, vet, staticcheck and the
  # unit tests. The conformance suite runs in the job `typescript and
  # conformance`.
  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STATICCHECK_VERSION: 0.8.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The cache has the module cache and the build cache. Its key comes
      # from the go.sum files.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            sdk/go/go.sum
            examples/echo-go/go.sum
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l sdk/go examples/echo-go)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not formatted. Run gofmt -w."
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: |
          go -C sdk/go vet ./...
          go -C examples/echo-go vet ./...
      - name: Install staticcheck
        run: go install "honnef.co/go/tools/cmd/staticcheck@v${STATICCHECK_VERSION}"
      - name: staticcheck
        run: |
          set -euo pipefail
          (cd sdk/go && staticcheck ./...)
          (cd examples/echo-go && staticcheck ./...)
      - name: Unit tests of the SDK
        run: go -C sdk/go test -race ./...

  # Builds and tests the TypeScript SDK and its example, builds the Go
  # example, then runs the conformance suite against the echo extension of
  # each SDK.
  typescript:
    name: typescript and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: npm ci
        run: npm ci
      - name: Build the SDK and the example
        run: npm run build --workspaces
      - name: Unit tests of the SDK
        run: npm test --workspace @nomux-sh/extension
      - name: Check the files of the npm package
        run: |
          set -euo pipefail
          npm pack --dry-run --json --workspace @nomux-sh/extension > "$RUNNER_TEMP/pack.json"
          unexpected="$(jq -r '.[0].files[].path' "$RUNNER_TEMP/pack.json" |
            grep -Ev '^(dist/.+\.(js|d\.ts)|README\.md|LICENSE-APACHE|LICENSE-MIT|package\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::The npm package has files that it must not have:"
            echo "$unexpected"
            exit 1
          fi
          jq -r '.[0].files[].path' "$RUNNER_TEMP/pack.json"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: examples/echo-go/go.sum
      - name: Build the Go echo extension
        env:
          CGO_ENABLED: "0"
        run: go build -C examples/echo-go -trimpath -ldflags="-s -w" -o bin/nomux-echo .
      - name: Build the conformance suite and the Rust echo extension
        run: cargo build --locked -p nomux-conformance -p nomux-echo
      - name: Conformance suite, Rust SDK
        run: target/debug/nomux-conformance --manifest examples/echo/extension.toml -- target/debug/nomux-echo
      - name: Conformance suite, TypeScript SDK
        run: >-
          target/debug/nomux-conformance --manifest examples/echo-typescript/extension.toml
          -- examples/echo-typescript/bin/nomux-echo
      - name: Conformance suite, Go SDK
        run: >-
          target/debug/nomux-conformance --manifest examples/echo-go/extension.toml
          -- examples/echo-go/bin/nomux-echo

  # Installs the three echo examples in the newest released nomux and calls
  # them. An SDK whose extensions the released host refuses fails here, before
  # a release tag.
  released-host:
    name: released host
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The newest released nomux. Change the version and the checksum
      # together when nomux makes a release.
      NOMUX_VERSION: 0.4.0
      NOMUX_SHA256: 5fbd9c4bca24e5da0903e6a143b3e3b912bac05675bd453ce53f08ddf6619bdd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nomux
        run: |
          set -euo pipefail
          archive="nomux-${NOMUX_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/nomux-sh/nomux/releases/download/v${NOMUX_VERSION}/$archive"
          echo "$NOMUX_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${archive%.tar.gz}" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: examples/echo-go/go.sum
      - name: Build the echo extensions
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          npm ci
          npm run build --workspaces
          go build -C examples/echo-go -trimpath -ldflags="-s -w" -o bin/nomux-echo .
          cargo build --locked -p nomux-echo
      - name: Install and call the echo extensions
        run: scripts/check-released-host.sh

  # Builds the crate from the packaged files only, as crates.io users do.
  # The job has no `buf` and no `protoc`.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo package
        run: cargo package -p nomux-extension --locked
      - name: Build with the minimum supported Rust version
        run: |
          set -euo pipefail
          msrv="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "nomux-extension") | .rust_version')"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check -p nomux-extension --all-features --locked

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: |
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -color
