name: Release

# A version tag publishes the package `@nomux-sh/extension` to npm, then the
# crate `nomux-extension` to crates.io, and makes the GitHub release. The steps for a maintainer are in
# https://github.com/nomux-sh/.github/blob/main/RELEASING.md

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# A second run for the same tag waits. A release is not cancelled in the
# middle of a publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The check of the `main` branch reads the history.
          fetch-depth: 0
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Check that the tag is equal to the crate version
        id: version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "nomux-extension") | .version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but the crate version is $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check that the npm package version is equal to the crate version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm_version="$(jq -r .version sdk/typescript/package.json)"
          if [ "$npm_version" != "$VERSION" ]; then
            echo "::error::The npm package version is $npm_version, but the crate version is $VERSION."
            exit 1
          fi
      - name: Check that the commit is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The commit of $GITHUB_REF_NAME is not on the main branch."
            exit 1
          fi
      - name: Check that the changelog has the section of the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-notes.sh "$VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@18101caa61cb89118e2ee749786f33c6d1f8a8cb # v2.90.9
        with:
          tool: cargo-nextest@0.9.152
      - name: cargo nextest
        run: cargo nextest run --workspace --locked
      - name: cargo test --doc
        run: cargo test --workspace --doc --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: npm ci
        run: npm ci
      # Provenance needs a `repository` URL that is equal to this repository.
      - name: Check the repository URL of the npm package
        run: |
          set -euo pipefail
          url="$(jq -r .repository.url sdk/typescript/package.json)"
          if [ "$url" != "git+https://github.com/$GITHUB_REPOSITORY.git" ]; then
            echo "::error::The repository URL of the npm package is $url."
            exit 1
          fi
      - name: Check the npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The secret NPM_TOKEN does not exist."
            exit 1
          fi
          npm whoami
      - name: npm publish --dry-run
        run: npm publish --dry-run --workspace @nomux-sh/extension --access public

  # The npm job runs before the crate job: when the npm publish fails, no
  # package of the version is public, and a second run can publish the version.
  npm:
    name: publish to npm
    needs: check
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      # A second run of the workflow does not publish the version again.
      - name: Find the version on npm
        id: registry
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@nomux-sh/extension@$VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@nomux-sh/extension@$VERSION is on npm. The job does not publish it again."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: npm ci
        if: steps.registry.outputs.published == 'false'
        run: npm ci
      # The script `prepack` of the package builds `dist` before the publish.
      - name: npm publish
        if: steps.registry.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace @nomux-sh/extension --provenance --access public

  publish:
    name: publish to crates.io
    needs: [check, npm]
    # Only a version tag starts this workflow, and the `check` job fails when
    # the commit is not on `main`. This condition is a second guard.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p nomux-extension --locked

  github-release:
    name: GitHub release
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # A version earlier than 1.0.0 or with a suffix is a pre-release.
          flags=()
          case "$VERSION" in
            0.* | *-*) flags+=(--prerelease) ;;
          esac
          scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
