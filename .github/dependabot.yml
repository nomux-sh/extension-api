version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "build"
    labels: ["dependencies"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
  # The npm workspace of the TypeScript SDK and its example. One
  # package-lock.json at the root pins all npm dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "build"
    labels: ["dependencies"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
  # The modules of the Go SDK and its example. Their google.golang.org/protobuf
  # versions stay equal: the example uses the SDK of this repository.
  - package-ecosystem: gomod
    directories:
      - /sdk/go
      - /examples/echo-go
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "build"
    labels: ["dependencies"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
