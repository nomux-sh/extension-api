version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
    groups:
      actions:
        update-types: ["minor", "patch"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    labels: ["dependencies"]
    groups:
      cargo:
        update-types: ["minor", "patch"]
  # The npm workspace of the TypeScript SDK and its example. One
  # package-lock.json at the root pins all npm dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    labels: ["dependencies"]
    groups:
      npm:
        update-types: ["minor", "patch"]
