[package]
name = "nomux-extension"
version = "0.1.2"
description = "The nomux extension SDK: the daemon part of an extension and the extension manifest"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/nomux-extension"
readme = "README.md"
keywords = ["nomux", "extension", "sdk", "protobuf", "plugin"]
categories = ["api-bindings", "development-tools"]
# The package has only the files that a build and a test run need. The
# generated code is in `src/generated/`, thus a build does not start `buf` or
# `protoc`.
include = ["src/**/*.rs", "tests/**/*.rs", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[features]
# The types and the validator of `extension.toml`. An extension does not need
# this feature. The nomux daemon and the `nomux` command-line client use it.
manifest = ["dep:semver", "dep:toml"]

[dependencies]
prost.workspace = true
semver = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[[test]]
name = "manifest"
required-features = ["manifest"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
